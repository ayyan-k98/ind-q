# EPyMARL Configuration for Coverage Environment

# === Environment Settings ===
env: coverage  # Registered environment name

env_args:
  n_agents: 4
  grid_size: 20
  episode_limit: 200
  sensor_range: 5
  fov_degrees: 120.0
  coverage_threshold: 0.80
  completion_threshold: 95.0
  obs_size: 64
  map_type: empty  # 'empty', 'rooms', 'random'
  obstacle_density: 0.15

  # Reward scaling
  reward_scale_coverage: 100.0
  reward_scale_shaping: 1.0
  reward_frontier_bonus: 0.5
  reward_spread_bonus: 0.1
  reward_stay_penalty: 0.2
  reward_step_penalty: 0.1

# === Training Settings ===
t_max: 2000000  # Total timesteps (2M)
test_interval: 10000  # Test every 10k steps
test_nepisode: 10  # Number of test episodes
log_interval: 10000  # Log every 10k steps
runner_log_interval: 10000
learner_log_interval: 10000
save_model: True
save_model_interval: 50000  # Save every 50k steps

# === Algorithm: QMIX ===
name: "qmix"

# === Agent Network ===
agent: "rnn"  # RNN agent
hidden_dim: 64  # Hidden layer size
rnn_hidden_dim: 64  # GRU hidden size

# === Mixer Network ===
mixing_embed_dim: 32  # Mixer embedding dimension
hypernet_layers: 2  # Hypernetwork layers
hypernet_embed: 64  # Hypernetwork embedding

# === Training Hyperparameters ===
batch_size: 32  # Batch size for training
batch_size_run: 1  # Batch size for running (parallel envs)
buffer_size: 5000  # Replay buffer size

lr: 0.0005  # Learning rate
optim_alpha: 0.99  # RMSProp alpha
optim_eps: 0.00001  # RMSProp epsilon

gamma: 0.99  # Discount factor
target_update_interval: 200  # Hard target update interval

# === Exploration ===
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000  # Anneal epsilon over 50k steps

# === Double Q-Learning ===
double_q: True

# === Logging ===
use_tensorboard: True
use_sacred: False  # Set to True if you want Sacred logging

# === Evaluation ===
evaluate: True
evaluation_epsilon: 0.0  # Greedy evaluation

# === Runner ===
runner: "episode"  # Episode runner
mac: "basic_mac"  # Multi-agent controller

# === Other ===
use_cuda: True  # Use GPU if available
seed: 0  # Random seed
