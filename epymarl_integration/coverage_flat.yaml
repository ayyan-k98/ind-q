# Coverage Environment - Flat Observations (Standard MLP/RNN)
# 20×20 grid with flat 64-dim observations for baseline comparison

env: coverage

env_args:
  map_name: "coverage"
  n_agents: 4
  grid_size: 20
  episode_limit: 200
  sensor_range: 2
  fov_degrees: 120.0
  coverage_threshold: 0.80
  completion_threshold: 95.0
  obs_size: 64
  map_type: random
  obstacle_density: 0.15

  # IMPORTANT: Use flat observations (not CNN)
  use_spatial_obs: False  # Flat 64-dim vector

  # Reward scaling (includes new rotation penalty)
  reward_scale_coverage: 0.5
  reward_scale_shaping: 0.1
  reward_frontier_bonus: 0.5
  reward_spread_bonus: 0.1
  reward_stay_penalty: 0.2
  reward_step_penalty: 0.1
  reward_rotation_penalty: 0.05  # NEW: Smooth movement

  seed: 42

# Training
t_max: 1000000  # 1M timesteps
test_interval: 10000
test_nepisode: 10
log_interval: 10000
runner_log_interval: 10000
learner_log_interval: 10000
grad_norm_clip: 10.0

# Model saving
save_model: True
save_model_interval: 50000

# Evaluation
evaluate: True
evaluation_epsilon: 0.0

# Logging
use_tensorboard: True
use_sacred: False

# Runner
runner: "episode"
mac: "basic_mac"  # Standard MAC (not CNN)

# Device
use_cuda: True
