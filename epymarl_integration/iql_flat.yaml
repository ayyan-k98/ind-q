# IQL (Independent Q-Learning) with Flat Observations
# Standard RNN agent - baseline for comparison with CNN

# Use standard MAC (not CNN)
mac: "basic_mac"

# Agent architecture
agent: "rnn"  # Standard RNN agent
rnn_hidden_dim: 64  # Hidden size for RNN

# Independent Q-Learning (no mixer)
learner: "q_learner"

# RL Hyperparameters
gamma: 0.99
batch_size: 32
buffer_size: 5000
lr: 0.0005
optim_alpha: 0.99
optim_eps: 0.00001

# Exploration
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 50000

# Training
target_update_interval: 200
learner_log_interval: 2000
runner_log_interval: 2000

# Action selection
action_selector: "epsilon_greedy"

# Observation settings
obs_agent_id: True   # Add agent ID to observation
obs_last_action: True  # Add last action to observation

# Use CUDA if available
use_cuda: True

# Checkpoint
checkpoint_path: ""
