# EPyMARL Configuration for Coverage Environment
# This file should be placed at: epymarl/src/config/envs/coverage.yaml

# Environment
env: coverage

env_args:
  map_name: "coverage"  # Required by EPyMARL (unused for coverage env)
  n_agents: 4
  grid_size: 30          # Increased from 20 for research validity (2.25x area)
  episode_limit: 300     # Increased from 200 to accommodate larger map
  sensor_range: 3        # Increased from 2 for 30x30 grid
  fov_degrees: 120.0
  coverage_threshold: 0.80
  completion_threshold: 95.0
  obs_size: 64
  map_type: random       # Changed from 'empty' to force coordination around obstacles
  obstacle_density: 0.2  # 20% walls create mazes/rooms (breaks line-of-sight)

  # Reward scaling - Fixed to prevent NaN loss from gradient explosion
  reward_scale_coverage: 0.5  # Reduced from 100.0 to keep returns in stable range
  reward_scale_shaping: 0.1   # Reduced from 1.0 to match coverage scale
  reward_frontier_bonus: 0.5
  reward_spread_bonus: 0.1
  reward_stay_penalty: 0.2
  reward_step_penalty: 0.1

  seed: 42

# Training
t_max: 2000000  # 2M timesteps
test_interval: 10000
test_nepisode: 10
log_interval: 10000
runner_log_interval: 10000
learner_log_interval: 10000
grad_norm_clip: 10.0  # Prevent gradient explosion

# Model saving
save_model: True
save_model_interval: 50000

# Evaluation
evaluate: True
evaluation_epsilon: 0.0

# Logging
use_tensorboard: True
use_sacred: False

# Runner
runner: "episode"
mac: "basic_mac"

# Device
use_cuda: True
