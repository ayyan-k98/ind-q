# EPyMARL Configuration for Coverage Environment
# This file should be placed at: epymarl/src/config/envs/coverage.yaml

# Environment
env: coverage

env_args:
  n_agents: 4
  grid_size: 20
  episode_limit: 200
  sensor_range: 5
  fov_degrees: 120.0
  coverage_threshold: 0.80
  completion_threshold: 95.0
  obs_size: 64
  map_type: empty  # Options: 'empty', 'rooms', 'random'
  obstacle_density: 0.15  # For random maps

  # Reward scaling
  reward_scale_coverage: 100.0
  reward_scale_shaping: 1.0
  reward_frontier_bonus: 0.5
  reward_spread_bonus: 0.1
  reward_stay_penalty: 0.2
  reward_step_penalty: 0.1

  seed: 42

# Training
t_max: 2000000  # 2M timesteps
test_interval: 10000
test_nepisode: 10
log_interval: 10000
runner_log_interval: 10000
learner_log_interval: 10000

# Model saving
save_model: True
save_model_interval: 50000

# Evaluation
evaluate: True
evaluation_epsilon: 0.0

# Logging
use_tensorboard: True
use_sacred: False

# Runner
runner: "episode"
mac: "basic_mac"

# Device
use_cuda: True
